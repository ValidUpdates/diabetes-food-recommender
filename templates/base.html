<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hybrid Diabetes Food Recommender{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<script>
  (function() {
    var saved = localStorage.getItem('hdfrs-theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>
<div class="topbar">
  <a href="/" class="brand">HDFRS <span class="brand-sub">Hybrid Diabetes Detection &amp; Food Recommender System</span></a>
  <nav>
    <a href="/patient" class="{% if active == 'patient' %}active{% endif %}">Patient</a>
    <a href="/healthcare-worker" class="{% if active == 'worker' %}active{% endif %}">Healthcare Worker</a>
    <a href="/admin" class="{% if active == 'admin' %}active{% endif %}">Admin</a>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.3V2.7M8 13.3V14.7M2.7 8H1.3M14.7 8H13.3M3.5 3.5L4.5 4.5M12.5 12.5L11.5 11.5M12.5 3.5L11.5 4.5M3.5 12.5L4.5 11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 9.7A5.8 5.8 0 016.3 2.5a5.8 5.8 0 107.2 7.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</div>
{% block content %}{% endblock %}
<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-name">Okonkwo Nwamaka Juliet</span>
    <span class="footer-sep">·</span>
    <span>U2022/5570034</span>
    <span class="footer-sep">·</span>
    <span>Computer Science</span>
    <span class="footer-sep">·</span>
    <span>University of Port Harcourt</span>
  </div>
</footer>
<script>
  function toggleTheme() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('hdfrs-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('hdfrs-theme', 'dark');
    }
  }
</script>
</body>
</html>
