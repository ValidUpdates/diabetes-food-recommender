<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Hybrid Diabetes Food Recommender{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="topbar">
  <a href="/" class="brand">HDFRS <span class="brand-sub">Hybrid Diabetes Detection &amp; Food Recommender System</span></a>
  <nav>
    <a href="/patient" class="{% if active == 'patient' %}active{% endif %}">Patient</a>
    <a href="/healthcare-worker" class="{% if active == 'worker' %}active{% endif %}">Healthcare Worker</a>
    <a href="/admin" class="{% if active == 'admin' %}active{% endif %}">Admin</a>
  </nav>
</div>
{% block content %}{% endblock %}
</body>
</html>
